[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nokshi"
dynamic = ["version"]
description = "Nokshi — Intelligent Context for AI Engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md. Ziaur Rahman (CoreBari)" }]
keywords = ["ai", "context", "tokens", "code-intelligence", "agents", "developer-tools"]
dependencies = ["rich>=13.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/programmerzia/nokshi"
Repository = "https://github.com/programmerzia/nokshi"
Issues = "https://github.com/programmerzia/nokshi/issues"
Changelog = "https://github.com/programmerzia/nokshi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nokshi = "nokshi.cli:main"

[tool.setuptools.packages.find]
include = ["nokshi*"]

[tool.setuptools.dynamic]
version = { attr = "nokshi.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # long lines
  "E702",   # semicolon-separated statements — deliberate style in this codebase
  "E741",   # ambiguous names (l, I) used intentionally in parsers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]  # tests import mid-file after fixtures
