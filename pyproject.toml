[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nokshi"
version = "0.3.0"
description = "Nokshi — Intelligent Context for AI Engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md. Ziaur Rahman (CoreBari)" }]
keywords = ["ai", "context", "tokens", "code-intelligence", "agents", "developer-tools"]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
nokshi = "nokshi.cli:main"

[tool.setuptools.packages.find]
include = ["nokshi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
